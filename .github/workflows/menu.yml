name: Build and deploy daily menus

on:
  schedule:
    - cron: '17 3,7 * * *'  # Early refresh + retry; avoid the busy full hour
  workflow_dispatch:
    inputs:
      allow_empty_today:
        description: Allow an empty weekday menu for a known holiday or closure
        required: false
        default: false
        type: boolean

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify scraper, date selection and animation contract
        run: |
          python3 scripts/test-menu.py
          node scripts/test-date.cjs
          python3 scripts/verify-anim-contract.py
      - name: Fetch menus
        run: python3 menu.py
      - name: Verify generated menu data
        env:
          ALLOW_EMPTY_TODAY: ${{ inputs.allow_empty_today || 'false' }}
        run: |
          args=()
          if [ "$ALLOW_EMPTY_TODAY" = "true" ]; then
            args+=(--allow-empty-today)
          fi
          python3 scripts/verify-menu-data.py output/data.json "${args[@]}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
