name: Build and deploy daily menus

on:
  schedule:
    - cron: '17 3,7 * * *'  # Early refresh + retry; avoid the busy full hour
  workflow_dispatch:
    inputs:
      allow_empty_today:
        description: Allow an empty weekday menu for a known holiday or closure
        required: false
        default: false
        type: boolean

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify scraper, date selection, animation and translation contracts
        run: |
          python3 scripts/test-menu.py
          python3 scripts/test-hardening.py
          node scripts/test-date.cjs
          node scripts/test-settings.cjs
          node scripts/test-account-sync.mjs
          node scripts/test-nutrition.mjs
          node scripts/test-i18n.mjs
          node zmittag-nutrition-core/test/run.mjs
          python3 scripts/verify-anim-contract.py
          python3 scripts/verify-i18n-contract.py
      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify offline UI in Chromium
        run: npm run test:browser
      - name: Fetch and verify generated menu data
        env:
          ALLOW_EMPTY_TODAY: ${{ inputs.allow_empty_today || 'false' }}
        run: |
          args=()
          if [ "$ALLOW_EMPTY_TODAY" = "true" ]; then
            args+=(--allow-empty-today)
          fi
          python3 menu.py "${args[@]}"
          python3 scripts/verify-menu-data.py output/data.json "${args[@]}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
